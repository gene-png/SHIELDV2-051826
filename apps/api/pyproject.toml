[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shield-api"
version = "0.1.0"
description = "SHIELD by Kentro v2.0 — backend API + Celery worker"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.31.0",
  "sqlalchemy>=2.0.35",
  "alembic>=1.13.3",
  "psycopg[binary]>=3.2.3",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.5.2",
  "python-multipart>=0.0.12",
  "authlib>=1.3.2",
  "PyJWT[crypto]>=2.9.0",
  "argon2-cffi>=23.1.0",
  "celery[redis]>=5.4.0",
  "redis>=5.1.1",
  "boto3>=1.35.36",
  "structlog>=24.4.0",
  "httpx>=0.27.2",
  "anthropic>=0.39.0",
  "openpyxl>=3.1.5",
  "weasyprint>=63.0",
  "jinja2>=3.1.4",
  "tenacity>=9.0.0",
  "python-dateutil>=2.9.0",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "pytest-postgresql>=6.1.1",
  "testcontainers[postgres,redis,minio]>=4.8.2",
  "respx>=0.21.1",
  "freezegun>=1.5.1",
  "ruff>=0.6.9",
  "mypy>=1.11.2",
  "pip-audit>=2.7.3",
  "bandit>=1.7.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
